<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="微信登录窗口示意占位">
  <!-- Concept-only placeholder standing in for the real WeChat login window
       snapshot returned by Runtime. Light background, stable 3:4 ratio. -->
  <rect width="600" height="800" fill="#f7f7f7"/>
  <rect x="0" y="0" width="600" height="44" fill="#ededed"/>
  <circle cx="26" cy="22" r="5" fill="#d2d2d2"/>
  <circle cx="46" cy="22" r="5" fill="#d2d2d2"/>
  <circle cx="66" cy="22" r="5" fill="#d2d2d2"/>
  <text x="300" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8a8a">微信</text>

  <g transform="translate(180 210)">
    <rect x="-6" y="-6" width="252" height="252" rx="6" fill="#ffffff" stroke="#e2e2e2"/>
    <!-- Schematic QR: corner finders + sparse modules, clearly not a scannable code -->
    <g fill="#2b2b2b">
      <rect x="14" y="14" width="56" height="56"/>
      <rect x="170" y="14" width="56" height="56"/>
      <rect x="14" y="170" width="56" height="56"/>
    </g>
    <g fill="#ffffff">
      <rect x="26" y="26" width="32" height="32"/>
      <rect x="182" y="26" width="32" height="32"/>
      <rect x="26" y="182" width="32" height="32"/>
    </g>
    <g fill="#2b2b2b">
      <rect x="34" y="34" width="16" height="16"/>
      <rect x="190" y="34" width="16" height="16"/>
      <rect x="34" y="190" width="16" height="16"/>
    </g>
    <g fill="#2b2b2b" opacity="0.85">
      <rect x="88" y="14" width="12" height="12"/><rect x="112" y="26" width="12" height="12"/>
      <rect x="136" y="14" width="12" height="12"/><rect x="88" y="50" width="12" height="12"/>
      <rect x="136" y="62" width="12" height="12"/><rect x="14" y="88" width="12" height="12"/>
      <rect x="38" y="100" width="12" height="12"/><rect x="62" y="88" width="12" height="12"/>
      <rect x="88" y="112" width="12" height="12"/><rect x="112" y="88" width="12" height="12"/>
      <rect x="136" y="112" width="12" height="12"/><rect x="160" y="88" width="12" height="12"/>
      <rect x="190" y="100" width="12" height="12"/><rect x="214" y="88" width="12" height="12"/>
      <rect x="14" y="136" width="12" height="12"/><rect x="50" y="136" width="12" height="12"/>
      <rect x="88" y="148" width="12" height="12"/><rect x="124" y="136" width="12" height="12"/>
      <rect x="160" y="148" width="12" height="12"/><rect x="202" y="136" width="12" height="12"/>
      <rect x="88" y="182" width="12" height="12"/><rect x="112" y="206" width="12" height="12"/>
      <rect x="148" y="182" width="12" height="12"/><rect x="184" y="206" width="12" height="12"/>
      <rect x="214" y="182" width="12" height="12"/><rect x="62" y="214" width="12" height="12"/>
      <rect x="136" y="214" width="12" height="12"/><rect x="190" y="160" width="12" height="12"/>
    </g>
    <circle cx="120" cy="120" r="22" fill="#ffffff"/>
    <circle cx="120" cy="120" r="16" fill="#07c160"/>
    <text x="120" y="126" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">微</text>
  </g>

  <text x="300" y="516" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#3d3d3d">扫码登录</text>
  <text x="300" y="548" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#9a9a9a">请使用手机微信扫描二维码登录</text>
  <text x="300" y="770" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0c0c0">概念稿占位图 · 非真实二维码</text>
</svg>
