<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-label="微信安全验证窗口示意占位">
  <!-- Concept-only placeholder for the WeChat security-confirmation window.
       Deliberately shows the confirm buttons near the bottom so the concept
       demonstrates that the frame must not crop them. -->
  <rect width="600" height="800" fill="#f7f7f7"/>
  <rect x="0" y="0" width="600" height="44" fill="#ededed"/>
  <circle cx="26" cy="22" r="5" fill="#d2d2d2"/>
  <circle cx="46" cy="22" r="5" fill="#d2d2d2"/>
  <circle cx="66" cy="22" r="5" fill="#d2d2d2"/>
  <text x="300" y="27" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8a8a">微信 · 安全验证</text>

  <circle cx="300" cy="250" r="42" fill="#fff6e6" stroke="#f0dcb4"/>
  <text x="300" y="264" text-anchor="middle" font-family="sans-serif" font-size="34" fill="#c7831d">!</text>

  <text x="300" y="360" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#3d3d3d">需要安全验证</text>
  <text x="300" y="396" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8a8a">检测到你在新设备登录</text>
  <text x="300" y="422" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8a8a8a">请在手机上确认后继续</text>

  <rect x="150" y="560" width="300" height="46" rx="4" fill="#07c160"/>
  <text x="300" y="590" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#ffffff">我已在手机确认</text>

  <rect x="150" y="624" width="300" height="46" rx="4" fill="#ffffff" stroke="#dcdcdc"/>
  <text x="300" y="654" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#3d3d3d">返回</text>

  <text x="300" y="770" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#c0c0c0">概念稿占位图 · 底部按钮必须完整可见</text>
</svg>
